<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#15122e" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#brandGrad)" stroke-width="2.5" />
  
  <!-- Monogram Initials AS -->
  <text 
    x="32" 
    y="41" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="28" 
    fill="url(#brandGrad)" 
    letter-spacing="-1.5"
  >
    AS
  </text>
  
  <!-- Available / Online Indicator Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#10b981" />
  <circle cx="50" cy="14" r="5.5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6" />
</svg>
